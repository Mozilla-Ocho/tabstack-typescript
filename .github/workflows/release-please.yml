# Opens and updates the release PR, creates the GitHub release once that PR
# merges, and dispatches publishing. This replaces Stainless's hosted
# release-please, which stopped with their shutdown.
#
# Uses upstream `release-please` from npm. It previously built a pinned fork of
# `stainless-api/release-please` from source, because `--changes-branch` is a
# fork-only flag and the two-branch (`main` + `next`) model needed it. That model
# is gone: codegen now opens a PR against `main` directly, so there is one branch,
# no flag, and no fork of a company that goes dark 2026-09-01.
#
# Two things stay manual, both because of org policy rather than design:
#
#   * The org forbids GitHub Actions from creating pull requests, so `release-pr`
#     gets a 403 and the run files an issue with the command instead.
#   * A release created with GITHUB_TOKEN emits no `release: published` event.
#     workflow_dispatch is an explicit exception to that rule, so this workflow
#     dispatches publishing itself — see the last step.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # to dispatch the publish workflow below

env:
  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'

      - name: Install release-please
        run: npm install -g release-please@17

      - name: Create the GitHub release
        id: github_release
        run: |
          before=$(gh release list --repo '${{ github.repository }}' --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          release-please github-release \
            --repo-url='${{ github.repository }}' \
            --target-branch=main \
            --token="$GH_TOKEN"
          after=$(gh release list --repo '${{ github.repository }}' --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          echo "before=$before after=$after"
          if [ "$before" != "$after" ]; then
            echo "released=$after" >> "$GITHUB_OUTPUT"
          fi

      # Fails with 403 when it has to create the PR, because the org forbids it.
      # Updating an existing PR succeeds. Either way the branch, bump and changelog
      # are already written, so this must not fail the run — the next step turns the
      # failure into an actionable issue.
      - name: Open or update the release PR
        id: release_pr
        continue-on-error: true
        run: |
          release-please release-pr \
            --repo-url='${{ github.repository }}' \
            --target-branch=main \
            --token="$GH_TOKEN"

      - name: File an issue with the command to open the release PR
        if: steps.release_pr.outcome == 'failure'
        run: |
          # Without --changes-branch the branch is `release-please--branches--main`,
          # not `...--changes--next`.
          branch=$(git ls-remote --heads origin 'release-please--branches--main*' \
            | head -1 | sed 's|.*refs/heads/||')
          if [ -z "$branch" ]; then
            echo "no release branch prepared; nothing to announce"
            exit 0
          fi
          git fetch --quiet origin "$branch"
          version=$(git show "origin/$branch:.release-please-manifest.json" | jq -r '.["."]')
          title="Release $version is ready to open"

          short=$(echo '${{ github.repository }}' | cut -d/ -f2)
          fence='```'
          {
            echo "Release **$version** is prepared on \`$branch\`. The version bump and changelog are already committed there."
            echo
            echo "This org does not allow GitHub Actions to create pull requests, so a person has to open it. From a \`tabstack-api-docs\` checkout:"
            echo
            echo "$fence"
            echo "node scripts/open-sdk-release.mjs $short"
            echo "$fence"
            echo
            echo "That finds the branch and version itself, applies the required label, and writes a body release-please can parse. Add \`--dry-run\` to see what it would do."
            echo
            echo "**Use the script.** Opening the PR by hand with \`gh pr create\` needs two things that are easy to miss, and getting either wrong makes the release silently skip while every run stays green:"
            echo
            echo "- the \`autorelease: pending\` label"
            echo "- a body release-please can parse — it splits on \`---\` lines and requires the middle section to start with \`## <version>\`"
            echo
            echo "Merging the PR creates the tag and GitHub release, and publishing is dispatched automatically."
            echo
            echo "Close this by hand if you decide not to release."
          } > "$RUNNER_TEMP/release-issue.md"

          existing=$(gh issue list --repo '${{ github.repository }}' --state open \
            --search "$title in:title" --json number --jq '.[0].number')

          # Assign whoever pushed, so this is delivered rather than merely filed.
          # Bots are skipped: codegen commits would otherwise assign the release
          # to github-actions.
          # `gh issue create` spells this --assignee, `gh issue edit` --add-assignee.
          create_args=()
          edit_args=()
          actor='${{ github.actor }}'
          case "$actor" in
            *'[bot]') ;;
            *)
              create_args=(--assignee "$actor")
              edit_args=(--add-assignee "$actor")
              ;;
          esac

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo '${{ github.repository }}' \
              --body-file "$RUNNER_TEMP/release-issue.md" "${edit_args[@]}"
            echo "updated issue #$existing"
          else
            gh issue create --repo '${{ github.repository }}' --title "$title" \
              --body-file "$RUNNER_TEMP/release-issue.md" "${create_args[@]}"
          fi

      # A release created with GITHUB_TOKEN emits no `release: published` event, so
      # publishing never fires on its own. workflow_dispatch is an explicit
      # exception to that rule, so GITHUB_TOKEN can start it directly. Same repo
      # only, and it needs `actions: write` above.
      # release-please files "Release X is ready to open" when it cannot create
      # the PR, and nothing closed it once the release shipped — one dead issue
      # per release, each telling you to do work already done. The release
      # existing is the definitive done signal.
      - name: Close the release issue
        if: steps.github_release.outputs.released != ''
        run: |
          set -euo pipefail
          version="${{ steps.github_release.outputs.released }}"
          version="${version#v}"
          num=$(gh issue list --repo '${{ github.repository }}' --state open \
            --search "Release $version is ready to open in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --repo '${{ github.repository }}' \
              --comment "Shipped — release $version is cut and publishing dispatched."
            echo "closed #$num"
          else
            echo "no open release issue for $version"
          fi

      - name: Publish the release
        if: steps.github_release.outputs.released != ''
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            publish=publish-npm.yml
          else
            publish=publish-pypi.yml
          fi
          echo "dispatching $publish for ${{ steps.github_release.outputs.released }}"
          gh workflow run "$publish" --repo '${{ github.repository }}'
