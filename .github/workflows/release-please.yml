# Cuts releases automatically, with no pull request.
#
# The Mozilla-Ocho org forbids GitHub Actions from creating pull requests, so the
# usual release-please flow — open a release PR, merge it, tag on merge — cannot
# run here. Pushing commits and creating releases are both allowed, so this does
# that instead: release-please prepares the version bump and changelog on its
# release branch, that branch is fast-forwarded onto main, and the release is
# created directly.
#
# It runs Stainless's fork of release-please rather than googleapis/release-please
# because release-please-config.json relies on --changes-branch, which only the
# fork supports: conventional commits are read from `next` while the release
# lands on `main`.
#
# The fork is built with pnpm and its own lockfile rather than installed with
# `npm install -g git+...`. npm's git-dep preparation resolves a newer TypeScript
# than the fork's tsconfig allows and the build fails on
# `moduleResolution=node10`.
#
# Publishing is not done here. npm and PyPI trusted publishing is bound to a
# specific workflow filename, so it has to stay in publish-npm.yml /
# publish-pypi.yml.
name: Release Please

on:
  push:
    branches:
      - next
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  RELEASE_PLEASE_REF: a116e1e520e0f87824acf46a2e79c91d41e819d7
  # The version the fork itself declares in packageManager. pnpm/action-setup is
  # not used: it needs a version from a root package.json, which tabstack-python
  # does not have, and in tabstack-typescript it would clash with that repo's own
  # packageManager pin. We are building the fork, so the fork's version is the
  # one that matters.
  PNPM_VERSION: 9.11.0
  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '20'

      - name: Build release-please
        run: |
          npm install -g "pnpm@$PNPM_VERSION"
          git clone --quiet https://github.com/stainless-api/release-please.git "$RUNNER_TEMP/release-please"
          git -C "$RUNNER_TEMP/release-please" checkout --quiet "$RELEASE_PLEASE_REF"
          pnpm --dir "$RUNNER_TEMP/release-please" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/release-please" run build

      # Prepares the release branch with the version bump and changelog. The final
      # step of this command, opening the PR, always fails with 403 here because of
      # the org policy. The branch is already written by then, so that failure is
      # expected and ignored.
      - name: Prepare the release branch
        continue-on-error: true
        run: |
          node "$RUNNER_TEMP/release-please/build/src/bin/release-please.js" release-pr \
            --repo-url='${{ github.repository }}' \
            --target-branch=main \
            --changes-branch=next \
            --token="$GH_TOKEN"

      - name: Release
        id: release
        run: |
          branch=$(git ls-remote --heads origin 'release-please--branches--main--changes--next*' \
            | head -1 | sed 's|.*refs/heads/||')
          if [ -z "$branch" ]; then
            echo "no release branch prepared, nothing to release"
            exit 0
          fi
          git fetch --quiet origin "$branch" main

          version=$(git show "refs/remotes/origin/$branch:.release-please-manifest.json" | jq -r '.["."]')
          main_version=$(git show refs/remotes/origin/main:.release-please-manifest.json | jq -r '.["."]')
          if [ "$version" = "$main_version" ]; then
            echo "main is already at $version, nothing to release"
            exit 0
          fi
          if gh release view "v$version" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "v$version already released"
            exit 0
          fi

          echo "releasing $main_version -> $version"
          # Fast-forward only. release-please branches off main, so this succeeds
          # unless main moved underneath us, in which case failing is correct.
          git push origin "refs/remotes/origin/$branch:refs/heads/main"
          gh release create "v$version" --repo '${{ github.repository }}' \
            --target main --title "v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # release-pr reads the current version from .release-please-manifest.json on
      # the changes branch, but the release only bumps it on main. Without this,
      # next keeps its old version and every later run re-proposes a version that
      # has already shipped.
      - name: Sync the release manifest back to next
        if: steps.release.outputs.released == 'true'
        run: |
          git fetch --quiet origin main next
          main_version=$(git show refs/remotes/origin/main:.release-please-manifest.json | jq -r '.["."]')
          next_version=$(git show refs/remotes/origin/next:.release-please-manifest.json | jq -r '.["."]')
          if [ "$main_version" = "$next_version" ]; then
            echo "next already at $next_version"
            exit 0
          fi
          git checkout --quiet -B next refs/remotes/origin/next
          git show refs/remotes/origin/main:.release-please-manifest.json > .release-please-manifest.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "chore: sync release manifest to next ($main_version)" \
              .release-please-manifest.json
          git push --quiet origin next

      # A release created with GITHUB_TOKEN does not trigger other workflows, so
      # publish-*.yml will not have fired. Try to dispatch it. If GITHUB_TOKEN is
      # not permitted to dispatch either, report what to run by hand rather than
      # failing the release, which has already succeeded by this point.
      - name: Publish
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            publish=publish-npm.yml
          else
            publish=publish-pypi.yml
          fi
          if gh workflow run "$publish" --repo '${{ github.repository }}'; then
            echo "dispatched $publish"
          else
            echo "::warning::could not dispatch $publish; run: gh workflow run $publish --repo ${{ github.repository }}"
            exit 1
          fi
